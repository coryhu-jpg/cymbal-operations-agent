# POS Troubleshooting RAG Tool Data Contract
schema_version: "v1.0"
contract_id: "contract-pos-rag-001"
title: "Point-of-Sale Terminal Runbook RAG Data Contract"
owner: "Retail SRE & Frontline Engineering"
status: "ACTIVE"

system:
  type: "BigQuery Vector Search & Retrieval-Augmented Generation"
  # Resolved at runtime by app.tools.rag_tool.resolve_project_id() /
  # resolve_chunk_table(). No concrete project id is committed to source control.
  project: "${GOOGLE_CLOUD_PROJECT}"
  dataset: "${POS_CHUNK_DATASET}"
  table: "${POS_CHUNK_TABLE}"
  qualified_table: "${GOOGLE_CLOUD_PROJECT}.${POS_CHUNK_DATASET}.${POS_CHUNK_TABLE}"
  qualified_table_source: "app/tools/rag_tool.py::resolve_chunk_table"
  vector_index: "pos_manual_chunk_embedding_idx"
  distance_type: "COSINE"
  embedding_model: "projects/${GOOGLE_CLOUD_PROJECT}/locations/${BIGQUERY_LOCATION}/models/text-embedding-005"
  embedding_dimensions: 768
  environment_variables:
    - name: "GOOGLE_CLOUD_PROJECT"
      required: true
      description: >-
        Target GCP project. Falls back to GCP_PROJECT, GOOGLE_CLOUD_QUOTA_PROJECT,
        then the Application Default Credentials project.
    - name: "POS_CHUNK_DATASET"
      required: false
      default: "cymbal_gold"
    - name: "POS_CHUNK_TABLE"
      required: false
      default: "pos_manual_chunk_embeddings"
    - name: "BIGQUERY_LOCATION"
      required: false
      default: "us-central1"
    - name: "POS_RAG_MIN_SIMILARITY"
      required: false
      default: 0.70
      description: "Overrides minimum_confidence_threshold below."
  unconfigured_behaviour: >-
    When no project can be resolved the tool logs an error and returns the
    canonical uncertified-answer refusal instead of raising, so import and test
    collection remain hermetic.

data_schema:
  fields:
    - name: "chunk_id"
      type: "STRING"
      mode: "REQUIRED"
      description: "Unique surrogate key: <doc_name>_chunk_<index>"
    - name: "document_filename"
      type: "STRING"
      mode: "REQUIRED"
      description: "Source PDF document filename in GCS bucket"
    - name: "document_title"
      type: "STRING"
      mode: "REQUIRED"
      description: "Human-readable terminal hardware/SOP manual title"
    - name: "chunk_index"
      type: "INT64"
      mode: "REQUIRED"
      description: "0-based sliding window index within document"
    - name: "chunk_content"
      type: "STRING"
      mode: "REQUIRED"
      description: "Extracted window text (500 chars with 100 char overlap)"
    - name: "gcs_source_uri"
      type: "STRING"
      mode: "REQUIRED"
      description: "Direct gs:// URL for frontline operator citation"
    - name: "embedding"
      type: "ARRAY<FLOAT64>"
      mode: "REQUIRED"
      description: "768-dimensional dense semantic vector from ML.GENERATE_EMBEDDING"

tool_interface:
  tool_name: "pos_troubleshooting_rag_tool"
  input_contract:
    type: "object"
    required: ["query"]
    properties:
      query:
        type: "string"
        description: "Frontline operator hardware fault description, error code, or recovery question"
      top_k:
        type: "integer"
        default: 3
        minimum: 1
        maximum: 10
      threshold:
        type: "number"
        default: 0.70
        minimum: 0.0
        maximum: 1.0
  output_contract:
    type: "object"
    required: ["status", "response"]
    properties:
      status:
        type: "string"
        enum: ["CERTIFIED_MATCH", "UNCERTIFIED_FALLBACK", "TEXT_SEARCH_FALLBACK"]
      matched_document:
        type: "string"
        description: "Title of the top matching hardware runbook"
      confidence_score:
        type: "number"
        description: "Normalized cosine similarity score (1 - distance)"
      gcs_documentation_link:
        type: "string"
        format: "uri"
        description: "Certified PDF document source link"
      stitched_procedure:
        type: "string"
        description: "Surrounding context stitched across adjacent chunks (N-1 to N+1)"
      response:
        type: "string"
        description: "Synthesized recovery instructions and operator safety steps"

service_level_agreements:
  max_latency_ms: 1500
  minimum_confidence_threshold: 0.70
  fallback_behavior: "Return certified safety warning string without fabricating hardware steps"
  warning_string: "WARNING: No certified POS hardware documentation matched with confidence >= 0.70. This inquiry appears out-of-scope for Cymbal POS terminal runbooks."
  warning_string_source: "app/tools/rag_tool.py::UNCERTIFIED_FALLBACK_MSG"
