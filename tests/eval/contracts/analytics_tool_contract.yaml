# BigQuery Analytics Tool Data Contract
schema_version: "v1.0"
contract_id: "contract-bq-analytics-002"
title: "BigQuery Lakehouse Data Agent Analytics Data Contract"
owner: "Enterprise Data Analytics & Lakehouse Platform"
status: "ACTIVE"

system:
  type: "Google BigQuery Data Agent (Conversational Analytics)"
  # Resolved at runtime by app.tools.analytics_tool.resolve_data_agent_name().
  # No concrete project id / data agent id is committed to source control so the
  # repository is portable across dev / staging / prod projects.
  data_agent_resource: "projects/${GOOGLE_CLOUD_PROJECT}/locations/${DATA_AGENT_LOCATION}/dataAgents/${DATA_AGENT_ID}"
  data_agent_resource_source: "app/tools/analytics_tool.py::resolve_data_agent_name"
  environment_variables:
    - name: "DATA_AGENT_NAME"
      required: false
      description: "Fully-qualified data agent resource. Takes precedence when set."
    - name: "GOOGLE_CLOUD_PROJECT"
      required: true
      description: "Target GCP project id used to compose the data agent resource."
    - name: "DATA_AGENT_LOCATION"
      required: false
      default: "global"
    - name: "DATA_AGENT_ID"
      required: true
      description: "Published BigQuery Conversational Analytics data agent id."
  unconfigured_behaviour: >-
    When neither DATA_AGENT_NAME nor DATA_AGENT_ID is present the tool returns a
    structured configuration error instead of raising, so import and test
    collection remain hermetic.
  governance:
    authentication_mode: "OAuth Delegated End-User Credentials"
    cost_guardrail:
      max_bytes_billed: 10737418240 # 10 GB per analytical query execution
      timeout_seconds: 60

underlying_datasets:
  - dataset_id: "cymbal_gold"
    tables:
      - name: "gold_inventory_reconciliation_ledger"
        type: "TABLE"
        partitioning: "business_date (DAY)"
        clustering: ["store_id", "product_sku"]
        key_metrics: ["cover_hours", "on_hand_qty", "safety_stock_level", "stockout_risk_flag"]
      - name: "pos_transactions_gold"
        type: "TABLE"
        partitioning: "business_date (DAY)"
        clustering: ["store_id", "cashier_id"]
        key_metrics: ["net_amount", "gross_amount", "discount_amount", "line_items"]
      - name: "pos_anomaly_alerts"
        type: "TABLE"
        partitioning: "alert_ts (DAY)"
        clustering: ["store_id", "alert_type"]
        key_metrics: ["risk_score", "alert_type", "cashier_id"]
  - dataset_id: "cymbal_silver"
    tables:
      - name: "item_warranties_extracted"
        type: "TABLE"
        key_metrics: ["product_sku", "warranty_months", "policy_terms"]

tool_interface:
  tool_name: "cymbal_analytics_tool"
  input_contract:
    type: "object"
    required: ["prompt"]
    properties:
      prompt:
        type: "string"
        description: "Analytical question requiring Lakehouse SQL synthesis, KPI calculation, or historical aggregation"
  output_contract:
    type: "object"
    required: ["answer", "status"]
    properties:
      status:
        type: "string"
        enum: ["SUCCESS", "QUERY_GUARDRAIL_EXCEEDED", "ERROR"]
      answer:
        type: "string"
        description: "Grounded analytical answer with exact numbers, currency, and unit measures"
      sql_query:
        type: "string"
        description: "Generated and executed BigQuery SQL query"
      referenced_tables:
        type: "array"
        items:
          type: "string"
        description: "List of Lakehouse tables used in execution"
      bytes_billed:
        type: "integer"
        description: "Query execution byte footprint"

service_level_agreements:
  max_latency_ms: 5000
  data_freshness: "Near real-time / Continuous Query streaming updates"
  deterministic_metrics: true
