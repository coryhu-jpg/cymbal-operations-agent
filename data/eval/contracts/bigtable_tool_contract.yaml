# Bigtable MCP Tool Data Contract
schema_version: "v1.0"
contract_id: "contract-bigtable-mcp-003"
title: "Cloud Bigtable Operational Cache MCP Tool Data Contract"
owner: "Real-Time Streaming & Checkout Systems Team"
status: "ACTIVE"

system:
  type: "Cloud Bigtable NoSQL via Cloud Run Model Context Protocol (MCP) Server"
  # Resolved at runtime by app.tools.bigtable_tool.resolve_service_url().
  # No static project number is committed to source control.
  service_url: "https://${BIGTABLE_MCP_SERVICE_NAME}-${GOOGLE_CLOUD_PROJECT_NUMBER}.${BIGTABLE_MCP_REGION}.run.app"
  service_url_source: "app/tools/bigtable_tool.py::resolve_service_url"
  environment_variables:
    - name: "BIGTABLE_MCP_SERVICE_URL"
      required: false
      description: "Fully qualified Cloud Run endpoint. Takes precedence when set."
    - name: "GOOGLE_CLOUD_PROJECT_NUMBER"
      required: true
      description: "Numeric project number used to compose the Cloud Run hostname."
    - name: "BIGTABLE_MCP_SERVICE_NAME"
      required: false
      default: "mcp-toolbox-bigtable"
    - name: "BIGTABLE_MCP_REGION"
      required: false
      default: "us-central1"
  unconfigured_behaviour: >-
    When neither variable is present the toolset targets the unroutable
    placeholder host `bigtable-mcp-endpoint-not-configured.invalid` so a
    misconfiguration fails loudly at call time and never reaches another
    tenant's project.
  instance_id: "operations-db"
  table_id: "cashier_realtime_alerts"
  auth_mechanism: "Google Cloud OIDC Bearer Token"
  auth_resolution: >-
    Lazy, first-request resolution. Application Default Credentials are tried
    first via google.oauth2.id_token.fetch_id_token; a bounded-timeout `gcloud`
    subprocess is only used as a fallback. No shell command runs at import time.

data_schema:
  row_key_specification:
    format: "STORE_{store_id:03d}#CASH_{cashier_id}"
    regex: "^STORE_[0-9]{3}#CASH_[0-9]{4}$"
    example: "STORE_048#CASH_1190"
  column_families:
    - name: "stats"
      description: "1-hour tumbling/hopping window streaming cashier metrics"
      columns:
        - name: "override_count_1h"
          type: "INT64"
          description: "Count of manager overrides executed in the last 60 minutes"
        - name: "total_scan_count_1h"
          type: "INT64"
          description: "Total items scanned in the last 60 minutes"
        - name: "override_rate_1h"
          type: "FLOAT64"
          description: "Calculated ratio: override_count_1h / total_scan_count_1h"
        - name: "last_updated_epoch_ms"
          type: "INT64"
          description: "Unix epoch timestamp of last pipeline sink write"
    - name: "flags"
      description: "Continuous anomaly enrichment status flags"
      columns:
        - name: "audit_required"
          type: "BOOLEAN"
          description: "Flag indicating supervisor or internal audit review required"
        - name: "promo_abuse_alert"
          type: "BOOLEAN"
          description: "Triggered if override_rate exceeds store baseline threshold"
        - name: "last_alert_id"
          type: "STRING"
          description: "Surrogate alert identifier: ALT-ANOMALY-..."

tool_interface:
  tool_name: "bigtable_mcp_toolset"
  input_contract:
    type: "object"
    required: ["store_id", "cashier_id"]
    properties:
      store_id:
        type: "string"
        description: "3-digit store identifier (e.g. '048' or '48')"
      cashier_id:
        type: "string"
        description: "Cashier identifier (e.g. 'CASH_1190')"
  output_contract:
    type: "object"
    required: ["row_key", "stats", "flags"]
    properties:
      row_key:
        type: "string"
      stats:
        type: "object"
        properties:
          override_count_1h:
            type: "integer"
          total_scan_count_1h:
            type: "integer"
          override_rate_1h:
            type: "number"
          last_updated_epoch_ms:
            type: "integer"
      flags:
        type: "object"
        properties:
          audit_required:
            type: "boolean"
          promo_abuse_alert:
            type: "boolean"
          last_alert_id:
            type: "string"

service_level_agreements:
  p95_read_latency_ms: 150
  token_refresh_interval_seconds: 3000
